services:
  sillytavern:
    build:
      context: .
    image: sillytavern-local:latest
    container_name: sillytavern
    restart: unless-stopped
    ports:
      - "8000:10000"
    environment:
      # 登录账号，第一次启动时自动创建；改完密码删掉 ./data/_storage 重启即可重建
      ST_USER: tavern
      ST_PASS: change-me-please
      # 自己一个人用给 1024 足够；机器只有 1G 内存就改回 400
      NODE_HEAP: "1024"
    volumes:
      # 账号、设置、角色卡、聊天记录、快捷回复、预设全在这里，备份就是打包这个目录
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:10000/version').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      start_period: 180s
      retries: 3
